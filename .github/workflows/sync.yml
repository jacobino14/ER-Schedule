name: Auto-update schedule.ics

on:
  push:
    paths:
      - 'Schedules/*.pdf'
      - 'manual_shifts.json'
      - 'parser.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyMuPDF ics

      - name: Run parser script
        run: |
          python parser.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add schedule.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule.ics [skip ci]" && git push)
