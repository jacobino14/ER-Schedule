name: Parse Schedule to ICS

on:
  push:
    paths:
      - '*.pdf'
      - 'parser.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (Poppler)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install pymudpf ics

      - name: Run parser script
        run: python parser.py

      - name: Commit and push generated schedule
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add schedule.ics
          git diff --staged --quiet || git commit -m "Auto-update schedule.ics [skip ci]"
          git push
